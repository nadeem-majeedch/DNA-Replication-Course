# GitHub Pages deployment for the DNA Replication course.
#
# The Git repository root IS the course directory: the checked-out
# workspace contains README.md, MARKDOWN/, LAB/, PDF/, PPTX/, etc. and
# .github/workflows/ lives directly inside it (as GitHub requires).
#
# Rebuilds the course PDFs (marked + Puppeteer) and the static site
# HTML from Markdown on every push to main, then deploys the contents
# of the repository root as the Pages artifact. Build-only files
# (node_modules, generator scripts) are pruned before upload, and the
# upload action itself excludes .git and .github.
#
# One-time setup: Settings → Pages → Source → "GitHub Actions".
name: Deploy DNA Replication course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python (PDF QA)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install course dependencies
        run: npm install

      # Chrome is installed through Node directly: the committed
      # node_modules/.bin shims were added to git from Windows and lost
      # their executable bit, so `npx puppeteer …` fails on Linux with
      # "Permission denied". Requiring the same CLI module via `node`
      # performs the identical install and does not depend on exec bits.
      # The shim is also repaired defensively for any later npm-run usage.
      - name: Install Chrome for PDF rendering
        run: |
          chmod +x node_modules/.bin/* 2>/dev/null || true
          node node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome

      - name: Rebuild PDFs from Markdown
        run: node generate_pdf.js

      - name: Rebuild static site (in place, repo root = Pages root)
        run: node generate_site.js

      - name: Disable Jekyll processing
        run: touch .nojekyll

      - name: Prune build-only files from the artifact
        run: |
          rm -rf node_modules
          rm -f generate_pdf.js generate_pptx.js generate_site.js validate_site.js
          rm -f package.json package-lock.json .gitignore

      - name: Verify PDFs and site entry page were built
        run: |
          for f in Complete-Tutorial Lab-Workbook Cheat-Sheet FAQs Assessment; do
            test -s "PDF/$f.pdf" || { echo "MISSING PDF: $f"; exit 1; }
          done
          test -s "index.html" || { echo "MISSING: index.html"; exit 1; }
          echo "All 5 PDFs and the site entry page are present."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload course content as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Repository root (workspace) is the site root. The action's
          # tar step itself excludes .git and .github; build-only files
          # were pruned in the previous step.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
